name: Weekly Market & Intel Auto Update

on:
  schedule:
    # 每周六美股收盘后自动运行 (UTC 时间周六 00:00，即北京时间周六 08:00)
    - cron: '0 0 * * 6'
  workflow_dispatch: # 支持在 GitHub 页面手动点击一键运行

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/python-setup@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance

      - name: Run Market Fetcher
        run: python fetch_intel.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add earnings.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data and earnings" && git push)
